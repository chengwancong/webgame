<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PA6 SP33 原生导出</title><style>body{font:14px 'Microsoft YaHei';background:#f7f1e3;color:#3c2b23}canvas{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0/16px 16px}</style><p id="status">读取原生生物…</p><canvas width="256" height="256"></canvas><script src="/runtime/spine-webgl.js"></script><script>Object.assign(window,spine)</script><script src="/runtime/binary.js"></script><script src="/export.js"></script><script>
(async()=>{const key=new URLSearchParams(location.search).get('family');if(key){const conf=await(await fetch('/families.json')).json(),c=key==='regression'?conf.regression:conf.families.find(f=>f.key===key);if(!c)throw Error('Unknown family '+key);await window.loadActor(c);if(!new URLSearchParams(location.search).has('inspect'))await window.exportActor();}window.ready=true;})().catch(e=>{window.failure=e.stack;document.querySelector('#status').textContent=e.stack;console.error(e);});
</script></html>
