<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PA6 候选原生对照</title><style>@font-face{font-family:WorldSans;src:url('/art/NotoSansSC.ttf')}body{background:#fcfaf5;color:#293940;font:14px WorldSans;margin:12px}canvas{display:block}</style><p id="status">PA6 原色生物候选，全部为原生骨骼首帧</p><canvas></canvas><script type="module">
import {createHero} from '/art/starsea/pets/sources/hero-preview.js';const config=await(await fetch('/families.json')).json(),poses=await(await fetch('/evidence/candidate-poses.json')).json(),hero=await createHero();hero.render(0);const images=new Map();async function image(url){if(!images.has(url)){const i=new Image();i.src=url;await i.decode();images.set(url,i);}return images.get(url);}const grass=await image('/art/open-world/textures/ow-art-grass.png'),road=await image('/art/open-world/five-islands/textures/ow-road-dirt.png'),hound=await(await fetch('/art/starsea/monsters/ss-mon-wind-hound/profile.json')).json(),ha=await(await fetch(hound.atlas)).json(),hi=await image(hound.image);await document.fonts.load('18px WorldSans');const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),names={wind:'风栖',mist:'雾铃',forge:'赤炉',frost:'霜镜',dragon:'龙眠',star:'沉星'};
function txt(s,x,y,size=14){g.fillStyle='#293940';g.font=size+'px WorldSans';g.textAlign='center';g.fillText(s,x,y);}function ground(y,h){g.fillStyle=g.createPattern(grass,'repeat');g.fillRect(0,y-h,canvas.width,h+5);g.fillStyle=g.createPattern(road,'repeat');g.fillRect(0,y-20,canvas.width,25);}
function refs(y,z){g.drawImage(hero.canvas,140-128*z,y-204.8*z,256*z,256*z);const f=ha.frames.idle_0,r=f.frame,b=f.spriteSourceSize;g.drawImage(hi,r.x,r.y,r.w,r.h,320+(b.x-hound.anchor[0]*256)*hound.scale*z,y+(b.y-hound.anchor[1]*256)*hound.scale*z,b.w*hound.scale*z,b.h*hound.scale*z);txt('主角约100px',140,y+28);txt('巡猎兽80px',320,y+28);}
window.boards={ready:true,async draw(island){canvas.width=1660;canvas.height=710;g.fillStyle='#fcfaf5';g.fillRect(0,0,1660,710);txt(names[island]+' · PA6 原生候选',830,35,26);txt('每档两个候选｜上：实际幼年尺寸；下：2×｜星号表示选定；原生悬空高度保留',830,66,16);const tiers=['free','light','heavy'],heights=[44,48,54];for(const [ri,z]of [1,2].entries()){const y=ri?570:245;ground(y,ri?235:140);refs(y,z);for(let tier=0;tier<3;tier++)for(let j=0;j<2;j++){const key=config.candidates[island][tier][j],p=poses[key],img=await image('/evidence/catalog/'+key+'.png'),x=560+(tier*2+j)*195,scale=heights[tier]/p.referencePixelHeight*z;g.drawImage(img,x-p.anchor[0]*scale,y-p.anchor[1]*scale,256*scale,256*scale);const selected=config.families.some(f=>f.island===island&&f.tier===tiers[tier]&&f.candidate===key);txt((selected?'★ ':'')+p.name,x,y+28,13);txt(['零氪44px','轻氪48px','重氪54px'][tier],x,y+49,13);}}return canvas.toDataURL();}};
</script></html>
