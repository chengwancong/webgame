<!doctype html><meta charset="utf-8"><title>Physical source / frames inspector</title><body style="background:#38404a;color:white;font:15px sans-serif"><h1>原图集 / 导出帧比对</h1><select id="clip" aria-label="片段"></select><input id="frame" aria-label="导出帧" type="range" min="0" value="0"><button id="scan">逐帧播放全部片段</button><p id="status"></p><canvas width="256" height="256"></canvas><img id="original" width="512"><script type="module">
const base='/abyss-walker-rewrite/open-world/',manifest=await(await fetch(base+'packages/asset-manifest/combat-physical-fx.json')).json(),select=document.querySelector('select'),slider=document.querySelector('input'),status=document.querySelector('#status'),canvas=document.querySelector('canvas'),g=canvas.getContext('2d');let active,table,image;
for(const id of Object.keys(manifest.clips))select.add(new Option(id,id));
async function load(id){active=manifest.clips[id];table=await(await fetch(base+'apps/web/public'+active.atlas)).json();image=new Image();image.src=base+'apps/web/public'+active.image;await image.decode();const lib='/'+encodeURIComponent('Q版日式手游SPINE特效300套')+'/'+encodeURIComponent(active.source.library)+'/',list=await(await fetch('/library-index.json')).json(),entry=list.find(e=>e.dir===active.source.library),atlas=await(await fetch(lib+entry.atlas)).text(),page=atlas.split(/\r?\n/).find(x=>/\.png$/i.test(x.trim())&&!/^\s/.test(x));document.querySelector('#original').src=lib+encodeURIComponent(page.trim());slider.max=active.frames.length-1;slider.value=0;draw();}
function draw(){const name=active.frames[+slider.value],f=table.frames[name].frame;g.clearRect(0,0,256,256);g.drawImage(image,f.x,f.y,f.w,f.h,0,0,256,256);status.textContent=select.value+' · '+active.source.library+' · '+active.source.mode+' · frame '+name;}
select.onchange=()=>load(select.value);slider.oninput=draw;document.querySelector('button').onclick=async()=>{for(const id of Object.keys(manifest.clips)){select.value=id;await load(id);for(let i=0;i<active.frames.length;i++){slider.value=i;draw();await new Promise(r=>setTimeout(r,34));}}status.textContent='全部 13 个片段逐帧播放完成（原图集保留右侧）';};await load(select.value);
</script>
