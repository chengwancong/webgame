<g font-size="12" fill="#3a3226">
<text class="th" x="488" y="36" style="fill:#3a3226">洞穴标杆线稿</text>
<text class="ts" x="488" y="66" style="fill:#3a3226">1 钟乳石把头顶封住</text>
<text class="ts" x="488" y="92" style="fill:#3a3226">2 左后、右后是高岩壁</text>
<text class="ts" x="488" y="118" style="fill:#3a3226">3 前沿只有矮石，不挡人</text>
<text class="ts" x="488" y="144" style="fill:#3a3226">4 地面是全图最亮的地方</text>
<text class="ts" x="488" y="170" style="fill:#3a3226">5 灯笼在墙上，光圈落地</text>
<text class="ts" x="488" y="196" style="fill:#3a3226">6 晶体做冷光点缀</text>
<text class="ts" x="488" y="222" style="fill:#3a3226">7 甬道通往更深处</text>
<text class="ts" x="488" y="248" style="fill:#3a3226">8 墙外是蓝紫暗部，不纯黑</text>
<text class="th" x="488" y="292" style="fill:#a3302a">画面里不出现</text>
<text class="ts" x="488" y="318" style="fill:#3a3226">天空、云、星海、天光</text>
<text class="ts" x="488" y="344" style="fill:#3a3226">窗外风景、地平线</text>
<text class="ts" x="488" y="370" style="fill:#3a3226">户外花盆、灌木、树</text>
<text class="ts" x="488" y="414" style="fill:#6b5f4a">比例：小人约 1 格宽，</text>
<text class="ts" x="488" y="436" style="fill:#6b5f4a">前沿矮石不过腰</text>
</g>
</svg>
