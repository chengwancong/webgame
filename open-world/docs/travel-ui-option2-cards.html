<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案2：塞尔达风格列表卡片</title>
<style>
body { margin: 0; padding: 20px; background: #0a0e14; font-family: sans-serif; }
.container { max-width: 900px; margin: 0 auto; }
h1 { color: #ffe8b8; text-align: center; font-size: 24px; margin-bottom: 10px; }
.desc { color: #b8d4e8; text-align: center; margin-bottom: 30px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
<h1>方案2：塞尔达风格 - 传送石碑列表</h1>
<p class="desc">参考：Zelda BOTW, Genshin Impact | 特点：大卡片 + 预览图 + 垂直滚动</p>

<svg width="900" height="800" viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a5a7f;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1a4a68;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3f4f;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1a2a35;stop-opacity:1" />
    </linearGradient>
    <filter id="cardShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="800" fill="#0d1a24"/>
  
  <!-- 标题栏 -->
  <rect width="900" height="80" fill="#102844" opacity="0.9"/>
  <text x="450" y="50" fill="#ffe8b8" font-size="32" font-weight="bold" text-anchor="middle">远行之门 - 选择目的地</text>
  
  <!-- 卡片1：草木荒原（已激活） -->
  <g transform="translate(50, 110)">
    <rect width="800" height="200" rx="16" fill="url(#cardGrad1)" stroke="#5da3d5" stroke-width="3" filter="url(#cardShadow)"/>
    
    <!-- 左侧预览图 -->
    <rect x="15" y="15" width="280" height="170" rx="12" fill="#1a4a68" stroke="#7eb3d8" stroke-width="2"/>
    <text x="155" y="85" fill="#5da3d5" font-size="16" text-anchor="middle">[草原景色]</text>
    <text x="155" y="105" fill="#7eb3d8" font-size="12" text-anchor="middle">蓝天、草地、远山</text>
    <circle cx="40" cy="40" r="15" fill="#4caf50" opacity="0.3"/>
    <circle cx="270" cy="160" r="20" fill="#85c7ff" opacity="0.2"/>
    
    <!-- 右侧信息 -->
    <g transform="translate(315, 30)">
      <text x="0" y="0" fill="#ffe8b8" font-size="26" font-weight="bold">草木荒原</text>
      <rect x="0" y="10" width="60" height="3" fill="#5da3d5" rx="1.5"/>
      
      <text x="0" y="40" fill="#d4e6f5" font-size="15">广袤的荒野，风吹草低见怪群</text>
      <text x="0" y="65" fill="#b8d4e8" font-size="13">适合初次远行的冒险者，敌人较弱</text>
      
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="110" height="28" rx="6" fill="#1a4a68" stroke="#5da3d5" stroke-width="1.5"/>
        <text x="55" y="19" fill="#85c7ff" font-size="13" font-weight="bold" text-anchor="middle">推荐等级 1-3</text>
      </g>
      
      <g transform="translate(125, 85)">
        <rect x="0" y="0" width="90" height="28" rx="6" fill="#2e7d32" stroke="#4caf50" stroke-width="1.5" filter="url(#glow)"/>
        <text x="45" y="19" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">✓ 已激活</text>
      </g>
      
      <!-- 传送按钮 -->
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="140" height="120" rx="12" fill="#4caf50" stroke="#2e7d32" stroke-width="2" filter="url(#glow)"/>
        <text x="70" y="55" fill="#fff" font-size="20" font-weight="bold" text-anchor="middle">传送</text>
        <text x="70" y="80" fill="#e8f5e9" font-size="28" text-anchor="middle">→</text>
      </g>
    </g>
  </g>
  
  <!-- 卡片2：迷雾林地（锁定） -->
  <g transform="translate(50, 340)">
    <rect width="800" height="200" rx="16" fill="url(#cardGrad2)" stroke="#2a3f4f" stroke-width="2" opacity="0.8" filter="url(#cardShadow)"/>
    
    <!-- 左侧预览图（模糊/锁定） -->
    <rect x="15" y="15" width="280" height="170" rx="12" fill="#1a2a35" stroke="#37474f" stroke-width="2"/>
    <rect x="15" y="15" width="280" height="170" rx="12" fill="#000" opacity="0.5"/>
    <text x="155" y="90" fill="#90a4ae" font-size="48" text-anchor="middle">🔒</text>
    <text x="155" y="120" fill="#7a9aaf" font-size="13" text-anchor="middle">[迷雾效果]</text>
    
    <!-- 右侧信息 -->
    <g transform="translate(315, 30)">
      <text x="0" y="0" fill="#7a9aaf" font-size="26" font-weight="bold">迷雾林地</text>
      <rect x="0" y="10" width="60" height="3" fill="#37474f" rx="1.5"/>
      
      <text x="0" y="40" fill="#5a7582" font-size="15">浓雾笼罩的古老森林</text>
      <text x="0" y="65" fill="#5a7582" font-size="13">危险的敌人潜伏在迷雾中</text>
      
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="110" height="28" rx="6" fill="#1a2a35" stroke="#37474f" stroke-width="1.5"/>
        <text x="55" y="19" fill="#7a9aaf" font-size="13" text-anchor="middle">推荐等级 4-6</text>
      </g>
      
      <g transform="translate(125, 85)">
        <rect x="0" y="0" width="320" height="28" rx="6" fill="#37474f" stroke="#546e7a" stroke-width="1.5"/>
        <text x="25" y="19" fill="#90a4ae" font-size="13" font-weight="bold">🔒</text>
        <text x="165" y="19" fill="#90a4ae" font-size="12" text-anchor="middle">击败草木荒原首领后开放</text>
      </g>
    </g>
  </g>
  
  <!-- 卡片3：赤岩裂谷（锁定） -->
  <g transform="translate(50, 570)">
    <rect width="800" height="200" rx="16" fill="url(#cardGrad2)" stroke="#2a3f4f" stroke-width="2" opacity="0.7" filter="url(#cardShadow)"/>
    
    <!-- 左侧预览图（锁定） -->
    <rect x="15" y="15" width="280" height="170" rx="12" fill="#1a2a35" stroke="#37474f" stroke-width="2"/>
    <rect x="15" y="15" width="280" height="170" rx="12" fill="#000" opacity="0.6"/>
    <text x="155" y="95" fill="#90a4ae" font-size="48" text-anchor="middle">🔒</text>
    
    <!-- 右侧信息 -->
    <g transform="translate(315, 30)">
      <text x="0" y="0" fill="#7a9aaf" font-size="26" font-weight="bold">赤岩裂谷</text>
      <rect x="0" y="10" width="60" height="3" fill="#37474f" rx="1.5"/>
      
      <text x="0" y="40" fill="#5a7582" font-size="15">炙热的岩浆与危险的裂缝</text>
      
      <g transform="translate(0, 65)">
        <rect x="0" y="0" width="110" height="28" rx="6" fill="#1a2a35" stroke="#37474f" stroke-width="1.5"/>
        <text x="55" y="19" fill="#7a9aaf" font-size="13" text-anchor="middle">推荐等级 7-9</text>
      </g>
      
      <g transform="translate(125, 65)">
        <rect x="0" y="0" width="280" height="28" rx="6" fill="#37474f" stroke="#546e7a" stroke-width="1.5"/>
        <text x="25" y="19" fill="#90a4ae" font-size="13" font-weight="bold">🔒</text>
        <text x="150" y="19" fill="#90a4ae" font-size="12" text-anchor="middle">击败迷雾林地首领后开放</text>
      </g>
    </g>
  </g>
</svg>

</div>
</body>
</html>
