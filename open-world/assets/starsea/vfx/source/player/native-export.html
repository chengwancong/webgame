<!doctype html><html><head><meta charset="utf-8"><title>原始特效区域动画技术导出</title><link rel="icon" href="data:,"></head><body><canvas id="stage" width="512" height="512"></canvas><script src="vendor/spine36.js"></script><script>
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:false,preserveDrawingBuffer:true}),renderer=new spine.webgl.SceneRenderer(canvas,gl,true),cache=new Map();
function sample(skeleton,a,t){skeleton.setToSetupPose();const state=new spine.AnimationState(new spine.AnimationStateData(skeleton.data));state.setAnimation(0,a.name,false);state.update(t);state.apply(skeleton);skeleton.updateWorldTransform();}
window.nativeExport={async load(item){let b=cache.get(item.id);if(!b){const raw=await(await fetch(item.runtimeJson)).json(),text=await(await fetch(item.runtimeAtlas)).text(),urls=text.split(/\r?\n/).filter((line,index,all)=>/\.png$/i.test(line)&&!/^\s/.test(line)&&(index===0||all[index-1]==='')),textures={};for(const url of urls){const im=new Image();im.src=new URL(url,new URL(item.runtimeAtlas,location.href)).href;await im.decode();textures[url]=new spine.webgl.GLTexture(gl,im);}const atlas=new spine.TextureAtlas(text,path=>textures[path]),d=new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas)).readSkeletonData(raw);const s=new spine.Skeleton(d),a=d.findAnimation(item.animation);let x=Infinity,y=Infinity,r=-Infinity,top=-Infinity;
for(let i=0;i<=Math.ceil(a.duration*30);i++){sample(s,a,Math.min(a.duration,i/30));for(const slot of s.drawOrder){if(slot.color.a<.001)continue;const att=slot.getAttachment();if(!(att instanceof spine.RegionAttachment))continue;const vs=new Float32Array(8);att.computeWorldVertices(slot.bone,vs,0,2);for(let n=0;n<8;n+=2){x=Math.min(x,vs[n]);y=Math.min(y,vs[n+1]);r=Math.max(r,vs[n]);top=Math.max(top,vs[n+1]);}}}
b={data:d,skeleton:s,animation:a,bounds:{x,y,width:r-x,height:top-y}};cache.set(item.id,b);}return {duration:b.animation.duration,bounds:b.bounds,frames:Math.ceil(b.animation.duration*30)+1,rendererVersion:'3.6',originalVersion:b.data.version};},frame(id,time){const b=cache.get(id);sample(b.skeleton,b.animation,time);const {x,y,width,height}=b.bounds,scale=480/Math.max(width,height);renderer.camera.viewportWidth=canvas.width/scale;renderer.camera.viewportHeight=canvas.height/scale;renderer.camera.position.x=x+width/2;renderer.camera.position.y=y+height/2;renderer.camera.update();gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);renderer.begin();renderer.drawSkeleton(b.skeleton,false);renderer.end();return {png:canvas.toDataURL('image/png'),root:[256-(x+width/2)*scale,256+(y+height/2)*scale],scale};}};
</script></body></html>
