<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="preview.css"><title>裂星远航 · 技能资源验收</title></head><body>
<header><h1>裂星远航 · 技能资源验收</h1><p>30项演出 · 真实角色挂点 · 原生层素材适配 · 30 Hz参考时间线</p></header>
<main><aside><label for="chapter">章节</label><select id="chapter"><option value="all">全部章节</option><option value="1">第一章</option><option value="2">第二章</option><option value="3">第三章</option><option value="4">第四章</option><option value="5">第五章</option><option value="6">第六章</option></select><nav id="list" aria-label="技能列表"></nav></aside>
<section class="viewer"><div class="heading"><h2 id="name">加载资源…</h2><span id="kind"></span></div>
<div class="controls"><button id="play">暂停</button><button id="restart">重播</button><button id="step">下一帧</button><button id="facing">朝向：右</button><label>速度 <select id="speed"><option value="1">1×</option><option value="0.25">0.25×</option></select></label><label>地面 <select id="background"><option value="grass">草地</option><option value="snow">霜镜雪地</option><option value="port">奶白港石</option></select></label><label>状态 <select id="mode"><option value="normal">完整演出</option><option value="interrupt">中断片段样本</option><option value="death">施法者死亡</option><option value="phase-end">阶段结束</option></select></label><label><input id="phase" type="checkbox">B3活动蒸汽</label><label><input id="move" type="checkbox">移动挂点验证</label><label><input id="sockets" type="checkbox" checked>显示挂点</label></div>
<div class="surface"><canvas id="stage" width="960" height="420" aria-label="原生动作、技能素材、预警几何动态预览"></canvas></div>
<div class="timeline"><input id="clock" type="range" min="0" max="210" step="1" value="0" aria-label="参考战斗tick"><output id="time">0 tick</output></div>
<div class="information"><p id="reference"></p><p id="status" role="status">加载资源…</p><p>本页重放明确标注的参考事件，不写战斗、奖励或任务进度。新敌人规则尚未绑定；技能机制与资源完成分别验收。</p></div><pre id="diagnostics"></pre></section></main>
<script src="vendor/spine42.js"></script><script type="module" src="preview.mjs"></script></body></html>
