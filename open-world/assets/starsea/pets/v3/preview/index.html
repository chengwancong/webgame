<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PA4 六岛宠物 · 162 套换皮</title><style>@font-face{font-family:WorldSans;src:url('/art/NotoSansSC.ttf')}*{box-sizing:border-box}body{margin:0;background:#fcfaf5;color:#293940;font:14px/1.5 WorldSans,'Microsoft YaHei',sans-serif}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{margin:0 0 12px}.filters{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}label{display:flex;align-items:center;gap:6px}select,button{font:inherit;min-height:36px;padding:6px 10px;background:#f3efe5;color:inherit;border:1px solid #c9c1af;border-radius:8px}button{cursor:pointer}button[aria-pressed=true]{background:#efcf85;border-color:#9a6e24}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #9a6e24;outline-offset:2px}.stage{overflow:auto}canvas{display:block;margin-inline:auto}small{color:#65747c}</style><main><h1>六岛同行 · 162 套宠物外观</h1><p>同家族共享原生动作；职业、流派与三档装饰实时合成。模型资源预览，不含玩法强度或定价。</p><div class="filters"><label>岛屿<select id="island"><option value="all">全部六岛</option><option value="wind" selected>风栖</option><option value="mist">雾铃</option><option value="forge">赤炉</option><option value="frost">霜镜</option><option value="dragon">龙眠</option><option value="star">沉星</option></select></label><label>职业<select id="profession"><option value="all">全部</option><option value="sword">剑</option><option value="staff">法杖</option><option value="hidden">暗器</option></select></label><label>氪度<select id="tier"><option value="all">全部</option><option value="free">零氪</option><option value="light">轻氪</option><option value="heavy">重氪</option></select></label><label>流派<select id="flow"><option value="all">全部九流派</option></select></label><label>形态<select id="form"><option value="young">幼年</option><option value="adult">成年</option><option value="awakened">觉醒</option></select></label><label>动作<select id="action"><option>idle</option><option>idle2</option><option>move</option><option>attack</option><option>knock</option></select></label><button id="mirror" aria-pressed="false">镜像</button><button id="pause" aria-pressed="false">暂停</button><label><input id="sockets" type="checkbox">挂点</label></div><p id="status" role="status">加载色板、挂件与共享底图…</p><div class="stage"><canvas id="view"></canvas></div><p><small>徽记表示流派；围巾、浮空晶石、尾饰表示职业。底图由材质分区和色板还原，挂件与常驻特效跟随逐帧挂点。</small></p></main><script type="module" src="./view.js"></script></html>
