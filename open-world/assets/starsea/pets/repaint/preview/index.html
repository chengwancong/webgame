<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风绒 PA2 · 三种画法</title><style>@font-face{font-family:WorldSans;src:url('/art/NotoSansSC.ttf')}*{box-sizing:border-box}body{margin:0;background:#fcfaf5;color:#293940;font:14px/1.5 WorldSans,'Microsoft YaHei',sans-serif}main{max-width:1280px;padding:24px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{margin:0 0 16px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{font:inherit;padding:8px 16px;border:1px solid #c9c1af;border-radius:8px;min-height:38px;color:inherit;background:#f3efe5}button{cursor:pointer}button[aria-pressed=true]{background:#efcf85;border-color:#9a6e24}button:focus-visible,select:focus-visible{outline:2px solid #9a6e24;outline-offset:2px}label{display:flex;align-items:center;gap:8px}.stage{overflow:auto}canvas{display:block}small{color:#65747c}a{color:#286b96}</style>
<main><h1>风绒 PA2 · 三种画法同场对照</h1><p>配色、细棕描边与点眼一致；只比较体积表现。PA2 成长为 a/c/d，PA1 对照保留 a/c/e。</p><div class="controls" aria-label="样稿与动作切换"><button data-style="1" aria-pressed="true">样稿 1 · 极简平涂</button><button data-style="2" aria-pressed="false">样稿 2 · 平涂毛边</button><button data-style="3" aria-pressed="false">样稿 3 · 柔和色面</button><button data-style="4" aria-pressed="false">PA1</button><label>动作<select id="action"><option value="idle">idle · 待机</option><option value="idle2">idle2 · 休闲</option><option value="move">move · 移动</option><option value="attack">attack · 攻击</option><option value="knock">knock · 击飞</option></select></label><button id="pause" aria-pressed="false">暂停</button><button id="mirror" aria-pressed="false">镜像</button></div><p id="status" role="status">正在加载真实渲染资源…</p><div class="stage"><canvas id="sheet"></canvas></div><p><small>上排保持实际像素大小，窄屏可横向查看；下排仅放大宠物用于检视。主角与两只怪物为正式资源。</small></p></main>
<script>const u=new URL(location.href);if(u.searchParams.get('mode')!=='preview'){u.searchParams.set('mode','preview');history.replaceState(null,'',u)};</script><script type="module" src="./review.js"></script><script type="module">
let style=1,mirror=false,paused=false;const wait=setInterval(()=>{if(window.pa2?.ready){clearInterval(wait);document.getElementById('status').textContent='已加载九套 PA2、三阶 PA1 和正式角色参照。画法尚未选定。'}},100);
function apply(){window.pa2?.set(style,document.getElementById('action').value,0,mirror)}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=+b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));apply()});document.getElementById('action').onchange=apply;document.getElementById('mirror').onclick=e=>{mirror=!mirror;e.target.setAttribute('aria-pressed',String(mirror));apply()};document.getElementById('pause').onclick=e=>{paused=!paused;e.target.setAttribute('aria-pressed',String(paused));e.target.textContent=paused?'播放':'暂停';window.pa2?.pause(paused)};
</script></html>
