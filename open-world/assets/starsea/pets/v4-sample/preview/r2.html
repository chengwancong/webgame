<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PA5-r2 龙眠重氪</title><style>@font-face{font-family:WorldSans;src:url('/art/NotoSansSC.ttf')}*{box-sizing:border-box}body{margin:0;background:#fcfaf5;color:#293940;font:14px/1.5 WorldSans,'Microsoft YaHei',sans-serif}main{padding:18px}h1{font-size:24px;margin:0 0 5px}p{margin:4px 0 10px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}label{display:flex;gap:6px;align-items:center}button,select{font:inherit;background:#f3efe5;border:1px solid #c9c1af;border-radius:7px;padding:7px 10px;color:inherit}button[aria-pressed=true]{background:#efcf85}button,select{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #9a6e24}.stage{overflow:auto;border:1px solid #d4cbb7;border-radius:10px}canvas{display:block}</style><main><h1>r2 · 先看龙本体</h1><p>甲 A10 站立翼龙 / 乙 A7 低伏鳍龙。杏仁眼、背深腹浅、保留吻部与角爪。A/B 两种画法待选。</p><div class="controls"><label>家族<select id="plan"><option value="all">甲＋乙</option><option value="甲">甲 · A10</option><option value="乙">乙 · A7</option></select></label><label>画法<select id="style"><option value="all">A＋B</option><option>A</option><option>B</option></select></label><label>形态<select id="form"><option value="all">三形态</option><option value="young">幼年</option><option value="adult">成年</option><option value="awakened">觉醒</option></select></label><label>动作<select id="action"><option>idle</option><option>idle2</option><option>move</option><option>attack</option><option>knock</option></select></label><label>倍率<select id="zoom"><option value="1">实际大小</option><option value="2" selected>2×</option></select></label><button id="mirror" aria-pressed="false">镜像</button><button id="pause" aria-pressed="false">暂停</button><label><input id="fx" type="checkbox">常驻特效</label></div><p id="status">加载r2共享图集…</p><div class="stage"><canvas id="view"></canvas></div><p>参照：主角约100px，零氪眠角成年56px、轻氪晓翼成年62px，二者沿用PA5原资源。</p></main><script type="module" src="./r2-view.js"></script></html>
