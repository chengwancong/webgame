<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PA5 · 龙眠氪度阶梯样稿</title>
<style>@font-face{font-family:WorldSans;src:url('/art/NotoSansSC.ttf')}*{box-sizing:border-box}body{margin:0;background:#fcfaf5;color:#293940;font:14px/1.5 WorldSans,'Microsoft YaHei',sans-serif}main{padding:24px;max-width:1600px;margin:auto}h1{font-size:26px;margin:0 0 6px}p{margin:0 0 12px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}label{display:flex;gap:7px;align-items:center}select,button{font:inherit;background:#f3efe5;color:inherit;border:1px solid #c9c1af;border-radius:8px;padding:7px 12px;min-height:38px}button{cursor:pointer}button[aria-pressed=true]{background:#efcf85;border-color:#9a6e24}button:focus-visible,select:focus-visible{outline:2px solid #9a6e24;outline-offset:2px}.stage{overflow:auto;border:1px solid #d4cbb7;border-radius:12px}canvas{display:block}iframe{width:100%;height:1050px;border:0}small{color:#65747c}.note{padding:10px 14px;background:#f3efe5;border-radius:8px}</style>
<main><h1>龙眠 · 氪度阶梯样稿</h1><p>余烬 / 霜卫，零氪、轻氪、重氪 A「精绘」、重氪 B「精绘＋饰甲」。本页保留两种重氪画法供比较。</p>
<div class="controls"><button id="r2" aria-pressed="false">r2 重画</button><button id="ladder" aria-pressed="true">阶梯样稿</button><label>流派<select id="flow"><option value="all">余烬＋霜卫</option><option value="ember">余烬</option><option value="glacier">霜卫</option></select></label><label>形态<select id="form"><option value="all">三形态并排</option><option value="young">幼年</option><option value="adult">成年</option><option value="awakened">觉醒</option></select></label><label>动作<select id="action"><option>idle</option><option>idle2</option><option>move</option><option>attack</option><option>knock</option></select></label><button id="mirror" aria-pressed="false">镜像</button><button id="pause" aria-pressed="false">暂停</button><label><input id="normalize" type="checkbox">统一 44px 对照</label><label><input id="fx" type="checkbox" checked>常驻特效</label><label><input id="sockets" type="checkbox">挂点</label><label>倍率<select id="zoom"><option value="1">实际大小</option><option value="2" selected>2× 放大</option></select></label></div>
<p id="status" role="status">加载共享形态…</p><div class="stage" id="sample"><canvas id="view"></canvas></div><iframe id="old" hidden title="PA4 只读对照"></iframe><iframe id="r2-frame" hidden title="PA5-r2 龙眠重氪重画"></iframe><p class="note">零氪 44 / 56 / 68px · 轻氪 48 / 62 / 74px · 重氪 54 / 70 / 84px。主角约 100px，风原巡猎兽约 80px。切掉「阶梯样稿」可查看原 PA4 的 162 只预览。</p></main><script type="module" src="./view.js"></script></html>
<script type="module">
const button=document.getElementById('r2'),frame=document.getElementById('r2-frame');let on=false;button.onclick=()=>{on=!on;button.setAttribute('aria-pressed',on);for(const el of document.querySelector('.controls').children)if(el!==button)el.style.display=on?'none':'';document.getElementById('status').hidden=on;document.getElementById('sample').hidden=on;document.getElementById('old').hidden=true;frame.hidden=!on;if(on){window.pa5?.suspend();frame.src='./r2.html';}else{frame.removeAttribute('src');window.pa5?.resume();}};if(new URLSearchParams(location.search).has('r2')){while(!window.pa5?.ready)await new Promise(requestAnimationFrame);button.click();}
</script>
