<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深渊行者 · Hub 面板预览</title>
<link rel="stylesheet" href="/src/ui-entry.css">
<link rel="stylesheet" href="/src/hub/hub-entry.css">
<style>
  /* 只有预览工具条用到的样式；面板本身全部来自游戏的样式表 */
  html{background:#222}
  #toolbar{position:fixed;left:0;right:0;bottom:0;z-index:2000;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 12px;background:rgba(0,0,0,.85);color:#ddd;font:13px sans-serif}
  #toolbar button,#toolbar select{padding:4px 10px;font:inherit}
  #note{margin-left:8px;color:#ffd77a}
  #stage{position:relative;width:1280px;height:720px;margin:0 auto;overflow:hidden;background:#3a4a58}
  #stage #modal{position:absolute;inset:0}
</style>
</head>
<body style="--stage-width:1280px;--stage-height:720px;margin:0">
<div id="stage"><div id="modal"></div></div>
<div id="toolbar">
  <span>Hub 预览：</span>
  <button id="btn-chart">航图</button>
  <button id="btn-today">今日</button>
  <button id="btn-commission">委托板</button>
  <button id="btn-port">港口建设</button>
  <button id="btn-result">结算（有 hub 块）</button>
  <button id="btn-result-plain">结算（无 hub 块）</button>
  <button id="btn-flip">轮换四角节点</button>
  <label>后端状态
    <select id="scenario">
      <option value="default">正常</option>
      <option value="404">404 未开放</option>
      <option value="error">5xx 出错</option>
      <option value="bagfull">背包已满</option>
      <option value="slow">响应很慢</option>
      <option value="fail">写操作失败</option>
    </select>
  </label>
  <span id="note"></span>
</div>
<script type="module" src="/src/hub/hub-review.ts"></script>
</body>
</html>
