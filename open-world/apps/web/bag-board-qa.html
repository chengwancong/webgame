<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>背包 · 版面验收</title></head><body>
<div id="modal" class="open"><div id="qa-host" style="--stage-width:1280px;--stage-height:720px;display:contents"></div></div>
<script type="module">
// 独立展示数据：只渲染真实 BagPanel / GearDetails，不读写玩家存档，不连接服务，不依赖 rules/index 或 node:crypto。
import './src/ui-entry.css';
import {BagPanel,bagHeader} from './src/components/BagPanel.ts';
import {loadGearDetails} from './src/components/GearDetails.ts';
import {panelHeaderHtml} from './src/ui-components.ts';
import {bagSelection,initialBagDraft} from './src/bag-model.ts';
import {isGearSlotFilter} from './src/equipment-slots.ts';
import {starterSkills} from '../../packages/content/index.ts';

const params=new URLSearchParams(location.search),full=params.has('full'),town=!params.has('field');
const qualities=['common','magic','rare','legendary'];
const count=full?60:36;
// 手工构造装备样例；无需 makeGear / resolveBuild / node:crypto。
const BASES=[
 {base:'standard-sword-t1-weapon',   slot:'weapon',    primary_attribute:'attack', attack:28,armor:0, effect:'none',  name:'苍风旅者长刃'},
 {base:'standard-sword-t1-armor',    slot:'armor',     primary_attribute:'armor',  attack:0, armor:12,effect:'none',  name:'守望轻甲'},
 {base:'standard-sword-t1-helmet',   slot:'helmet',    primary_attribute:'armor',  attack:0, armor:9, effect:'none',  name:'铁卫兜帽'},
 {base:'standard-sword-t1-necklace', slot:'accessory', primary_attribute:'attack', attack:6, armor:0, effect:'chain', name:'雷纹护符'},
 {base:'standard-sword-t1-ring',     slot:'ring',      primary_attribute:'attack', attack:5, armor:0, effect:'none',  name:'虚空铜环'},
 {base:'standard-hammer-t2-weapon',  slot:'weapon',    primary_attribute:'attack', attack:36,armor:0, effect:'none',  name:'轰破战锤'},
 {base:'omega-blade',                slot:'weapon',    primary_attribute:'attack', attack:42,armor:0, effect:'none',  name:'奥义之刃'},
 {base:'standard-hammer-t2-armor',   slot:'armor',     primary_attribute:'armor',  attack:0, armor:15,effect:'none',  name:'深泉板甲'},
];
const affixPool=[
 {stat:'critChance',value:0.04,name:'暴击率'},
 {stat:'hp',       value:36,  name:'生命上限'},
 {stat:'fireResist',value:0.08,name:'火焰抗性'},
 {stat:'speed',    value:0.05, name:'移动速度'},
 {stat:'cdr',      value:0.06, name:'冷却缩减'},
 {stat:'lifesteal',value:0.02, name:'生命偷取'},
];
const gear=Array.from({length:count},(_,i)=>{
 const b=BASES[i%BASES.length];
 const quality=qualities[(i*7+i%3)%4];
 const n={common:0,magic:1,rare:3,legendary:4}[quality];
 const affixes=Array.from({length:n},(_,k)=>{const a=affixPool[(i+k)%affixPool.length];return {id:'qa-'+i+'-'+k,name:a.name,tier:1+(i+k)%3,stat:a.stat,value:a.value,description:a.name};});
 const rank=i%7===3?2+i%4:0;
 const statVal=b.attack||b.armor;
 const enhancement=rank?Math.round(statVal*0.05*rank):0;
 return {id:'qa-'+i,base:b.base,slot:b.slot,name:b.name+(rank?' +'+rank:''),primary_attribute:b.primary_attribute,
   attack:b.attack,armor:b.armor,effect:b.effect,quality,affixes,rank,locked:i%9===4,
   mainStat:{stat:b.primary_attribute,value:statVal},
   hex:undefined};
});
const pick=slot=>gear.find(g=>g.slot===slot);
const equipment={};for(const slot of ['weapon','armor','helmet','accessory','ring']){const g=pick(slot);if(g)equipment[slot]=g.id;}
const stats={attack:43,armor:18,hp:380,hp_max:380,critChance:0.06,speed:1.2,attackSpeed:1,cdr:0,lifesteal:0,fireResist:0,coldResist:0,lightningResist:0};
const snapshot={id:'qa',name:'远行者',revision:7,build:1,level:5,xp:0,gold:100344,material:10039,
 gear,equipment,stats,resolvedSkills:[],skillAccess:[],hexActive:[],capacity:60,
 skills:[...starterSkills],skillRanks:Object.fromEntries(starterSkills.map(id=>[id,1])),skillBooks:{ember:2},
 progress:{kills:0,regions:['town'],bosses:[],safe:'town',tasks:[]},
 progression:{consumables:{tonic_attack:3,tonic_hp:6},materials:{ore:52,herb:18},buffs:{}},
 rewards:params.has('rewards')||full?[{id:'r1',region:'town',gear:gear[1]},{id:'r2',region:'town',gear:gear[2]}]:[]};
const ui={...initialBagDraft(),loading:false,quoteTarget:'',quoteCharacter:'',quoteLoading:false,busy:false,message:'',error:'',status:'',category:params.get('tab')??'equipment'};
let quality='',slot='';
const host=document.querySelector('#qa-host');
const gearById=id=>snapshot.gear.find(g=>g.id===id);
const preview=async id=>{const g=gearById(id),worn=Object.values(snapshot.equipment).includes(id);return {gear_id:id,revision:snapshot.revision,verdict:'even',cost:{gold:120,material:3},max:false,salvage:{gear_id:id,material:3,allowed:!g.locked&&!worn,blocked:g.locked?'locked':worn?'equipped':''},current:{stats:snapshot.stats,resolvedSkills:[]},equipped:{stats:snapshot.stats,resolvedSkills:[]},upgraded:{stats:snapshot.stats,resolvedSkills:[]}};};
const tip=async id=>{const g=gearById(id),main=g.mainStat?{stat:g.mainStat.stat,base:g.mainStat.value,enhancement:g.rank?Math.round(g.mainStat.value*0.05*g.rank):0,effective:g.mainStat.value+(g.rank?Math.round(g.mainStat.value*0.05*g.rank):0)}:{stat:g.primary_attribute??'attack',base:g.attack||g.armor||0,enhancement:0,effective:g.attack||g.armor||0};
 const stat=main.stat,worn=snapshot.equipment[g.slot],cur=gearById(worn),curMain=cur?.mainStat?{stat:cur.mainStat.stat,effective:cur.mainStat.value}:undefined;
 const delta=curMain&&curMain.stat===stat?main.effective-curMain.effective:0;
 return {gear:g,revision:snapshot.revision,primary_attribute:stat,attributes:{base:{[stat]:main.base},enhancement:{[stat]:main.enhancement},effective:{[stat]:main.effective}},comparison:{attack:{current:43,equipped:43+(stat==='attack'?delta:0),delta:stat==='attack'?delta:0},armor:{current:18,equipped:18+(stat==='armor'?delta:0),delta:stat==='armor'?delta:0},hp:{current:380,equipped:380+(stat==='hp'?delta:0),delta:stat==='hp'?delta:0}},currentSets:[],equippedSets:[]};};
function render(){
 const keep=host.querySelector('[data-bag-scroll=list]')?.scrollTop??0;
 const selection=bagSelection(snapshot,ui,quality,slot,ui.metadata);ui.selected=selection.selected?.key??'';
 host.innerHTML=`<section data-panel="bag" class="panel panel-wide" role="dialog" aria-label="背包">${panelHeaderHtml('背包',{actionsHtml:bagHeader(snapshot),closeLabel:'关闭'})}${BagPanel({snapshot,ui,quality,slot,busy:false,blocked:false,inTown:town})}</section>`;
 const list=host.querySelector('[data-bag-scroll=list]');if(list)list.scrollTop=keep;
 const g=selection.selected?.kind==='equipment'?selection.selected.gear:undefined;
 if(g)loadGearDetails(g,snapshot,{busy:false,preview,tip,error:e=>console.error(e)});
}
document.addEventListener('click',event=>{
 const node=event.target.closest('[data-action]');if(!node)return;const {action,id}=node.dataset;
 if(action==='bag-category'){ui.category=id;ui.selected='';ui.query='';quality='';slot='';}
 else if(action==='bag-select'){ui.selected=id;}
 else if(action==='bag-pick'){if(!['all','equipment'].includes(ui.category))ui.category='equipment';quality='';slot='';ui.query='';ui.selected=id;}
 else if(action==='bag-part'){ui.category='equipment';ui.query='';ui.selected='';slot=isGearSlotFilter(id)?id:'';}
 else if(action==='bag-quality'){quality=id;ui.selected='';}
 else if(action==='equip'){const g=gearById(id);snapshot.equipment[g.slot]=id;snapshot.revision++;}
 else if(action==='unequip'){const g=gearById(id);delete snapshot.equipment[g.slot];snapshot.revision++;}
 else if(action==='lock'){const g=gearById(id);g.locked=!g.locked;snapshot.revision++;}
 else return;
 render();
});
document.addEventListener('input',event=>{const input=event.target;if(input.dataset?.action==='bag-search'){ui.query=input.value;render();const next=document.querySelector('#bag-search');next?.focus();next?.setSelectionRange(input.value.length,input.value.length);}});
render();
</script></body></html>
