<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深渊行者 · 棋盘回合制预览</title>
<link rel="stylesheet" href="/src/ui-entry.css">
<link rel="stylesheet" href="/src/hub/hub-entry.css">
<link rel="stylesheet" href="/src/tactical/tactical.css">

</head>
<body class="tb-review">
<div id="stage-wrap"><div id="stage"></div></div>

<!-- 沙盒开局面板（仅沙盒数据源时显示） -->
<div id="sandbox-panel" hidden role="dialog" aria-modal="true" aria-label="沙盒开局设置">
 <div class="sandbox-card">
  <h2>沙盒开局设置</h2>
  <p class="sandbox-note">战棋沙盒 · 不发奖（不写角色存档）。编排只在开局时提交，开局后不可修改。</p>
  <div class="sandbox-field ui-field">
   <label for="sandbox-board">棋盘</label>
   <select class="ui-select" id="sandbox-board"><option value="default">（加载中…）</option></select>
  </div>
  <div class="sandbox-field ui-field">
   <label for="sandbox-hero">英雄</label>
   <select class="ui-select" id="sandbox-hero"></select>
  </div>
  <div class="sandbox-field ui-field">
   <label for="sandbox-seed">种子（可选，留空随机）</label>
   <input type="text" id="sandbox-seed" placeholder="如：37">
  </div>
  <div class="sandbox-field ui-field">
   <label>技能优先级（上方优先）</label>
   <ul id="sandbox-priority" class="sandbox-priority-list"></ul>
  </div>
  <div class="sandbox-switches">
   <div class="sandbox-switch-row">
    <label for="sandbox-target">目标</label>
    <select class="ui-select" id="sandbox-target">
     <option value="">不设置</option>
     <option value="nearest">最近（nearest）</option>
     <option value="lowest-hp">最低血量（lowest-hp）</option>
     <option value="support-first">优先辅助（support-first）</option>
    </select>
   </div>
   <div class="sandbox-switch-row">
    <label for="sandbox-position">位置</label>
    <select class="ui-select" id="sandbox-position">
     <option value="">不设置</option>
     <option value="stay-close">贴近（stay-close）</option>
     <option value="keep-distance">保持距离（keep-distance）</option>
     <option value="behind-cover">绕到掩体后（behind-cover）</option>
    </select>
   </div>
   <div class="sandbox-switch-row">
    <label for="sandbox-guard">保命守护</label>
    <input type="checkbox" id="sandbox-guard" aria-label="低于 50% 生命先用防护">
    <span class="ui-caption">低于 50% 生命先用防护</span>
   </div>
  </div>
  <span id="sandbox-status" role="status" aria-live="polite"></span>
  <button id="sandbox-start" class="ui-button ui-button--primary" type="button">开始</button>
 </div>
</div>

<div id="toolbar" aria-label="预览工具条（不属于游戏界面）">
  <strong id="toolbar-title">棋盘预览</strong>
  <label>场景
    <select id="scenario">
      <option value="default">正常</option>
      <option value="timeout">短等待（15 秒）</option>
      <option value="defeat">失败</option>
      <option value="load-error">首次载入失败</option>
      <option value="conflict">首个指令冲突</option>
      <option value="version">版本不一致</option>
      <option value="empty">没有遭遇</option>
      <option value="intents">意图展示（七种）</option>
    </select>
  </label>
  <button id="btn-offline" type="button" aria-pressed="false">断开连接</button>
  <button id="btn-drop" type="button">丢失下一条回执</button>
  <button id="btn-conflict" type="button">下一次指令冲突</button>
  <button id="btn-refresh" type="button">模拟刷新页面</button>
  <button id="btn-motion" type="button" aria-pressed="false">减少动态</button>
  <span id="source-label"></span>
  <span id="diag" aria-live="off"></span>
</div>
<script type="module" src="/src/tactical/tactical-board.ts"></script>
</body>
</html>
