<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深渊行者 · 棋盘回合制预览</title>
<link rel="stylesheet" href="/src/ui-entry.css">
<link rel="stylesheet" href="/src/tactical/tactical.css">
<style>
/* 沙盒开局面板 */
#sandbox-panel{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}
#sandbox-panel[hidden]{display:none}
.sandbox-card{background:var(--color-panel);border:1px solid var(--color-border);border-radius:var(--radius-panel,12px);padding:24px 28px;max-width:420px;width:100%;box-sizing:border-box;font-family:var(--font-family,sans-serif);color:var(--color-text-primary)}
.sandbox-card h2{margin:0 0 16px;font-size:18px;font-weight:700}
.sandbox-field{margin:0 0 14px}
.sandbox-field label{display:block;font-size:13px;color:var(--color-text-secondary);margin-bottom:4px;font-weight:600}
.sandbox-field select,.sandbox-field input{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--color-border-strong);border-radius:6px;background:var(--color-panel-inset);color:inherit;font:inherit}
.sandbox-priority-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.sandbox-priority-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;border:1px solid var(--color-border);background:var(--color-panel-raised,var(--color-panel-inset))}
.sandbox-priority-order{width:18px;font-size:12px;color:var(--color-highlight,#c09a40);font-weight:700;text-align:right;flex-shrink:0}
.sandbox-priority-label{flex:1;font-size:13px;font-family:monospace}
.sandbox-priority-up,.sandbox-priority-down{border:none;background:none;cursor:pointer;padding:0 4px;font-size:14px;color:var(--color-text-secondary);line-height:1}
.sandbox-priority-up:disabled,.sandbox-priority-down:disabled{opacity:.35;cursor:default}
.sandbox-switches{display:grid;gap:8px;margin:0 0 14px}
.sandbox-switch-row{display:flex;align-items:center;gap:10px}
.sandbox-switch-row label{min-width:60px;font-size:13px;font-weight:600;color:var(--color-text-secondary)}
.sandbox-switch-row select{flex:1;padding:5px 8px;border:1px solid var(--color-border-strong);border-radius:6px;background:var(--color-panel-inset);color:inherit;font:inherit;font-size:13px}
.sandbox-switch-row input[type=checkbox]{width:18px;height:18px;cursor:pointer}
#sandbox-status{display:block;min-height:18px;font-size:12px;color:var(--color-danger-strong,#c00);margin:8px 0 0}
.sandbox-note{font-size:12px;color:var(--color-text-secondary);margin:12px 0 0;line-height:1.5}
#sandbox-start{width:100%;margin:16px 0 0;padding:10px;font:inherit;font-weight:700;font-size:15px;border:none;border-radius:8px;cursor:pointer;background:var(--color-primary,#c09a40);color:#fff}
#sandbox-start:disabled{opacity:.6;cursor:default}
/* 工具条数据源标签 */
#source-label{margin-left:auto;padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--color-primary,#c09a40) 18%,transparent);font-size:11px;font-weight:600;color:var(--color-highlight,#c09a40)}
</style>
</head>
<body class="tb-review">
<div id="stage-wrap"><div id="stage"></div></div>

<!-- 沙盒开局面板（仅沙盒数据源时显示） -->
<div id="sandbox-panel" hidden role="dialog" aria-modal="true" aria-label="沙盒开局设置">
 <div class="sandbox-card">
  <h2>沙盒开局设置</h2>
  <p class="sandbox-note" style="margin:0 0 14px">战棋沙盒 · 不发奖（不写角色存档）。编排只在开局时提交，开局后不可修改。</p>
  <div class="sandbox-field">
   <label for="sandbox-board">棋盘</label>
   <select id="sandbox-board"><option value="default">（加载中…）</option></select>
  </div>
  <div class="sandbox-field">
   <label for="sandbox-hero">英雄</label>
   <select id="sandbox-hero"></select>
  </div>
  <div class="sandbox-field">
   <label for="sandbox-seed">种子（可选，留空随机）</label>
   <input type="text" id="sandbox-seed" placeholder="如：37">
  </div>
  <div class="sandbox-field">
   <label>技能优先级（上方优先）</label>
   <ul id="sandbox-priority" class="sandbox-priority-list"></ul>
  </div>
  <div class="sandbox-switches">
   <div class="sandbox-switch-row">
    <label for="sandbox-target">目标</label>
    <select id="sandbox-target">
     <option value="">不设置</option>
     <option value="nearest">最近（nearest）</option>
     <option value="lowest-hp">最低血量（lowest-hp）</option>
     <option value="support-first">优先辅助（support-first）</option>
    </select>
   </div>
   <div class="sandbox-switch-row">
    <label for="sandbox-position">位置</label>
    <select id="sandbox-position">
     <option value="">不设置</option>
     <option value="stay-close">贴近（stay-close）</option>
     <option value="keep-distance">保持距离（keep-distance）</option>
     <option value="behind-cover">绕到掩体后（behind-cover）</option>
    </select>
   </div>
   <div class="sandbox-switch-row">
    <label for="sandbox-guard">保命守护</label>
    <input type="checkbox" id="sandbox-guard" aria-label="低于 50% 生命先用防护">
    <span style="font-size:12px;color:var(--color-text-secondary)">低于 50% 生命先用防护</span>
   </div>
  </div>
  <span id="sandbox-status" role="status" aria-live="polite"></span>
  <button id="sandbox-start" type="button">开始</button>
 </div>
</div>

<div id="toolbar" aria-label="预览工具条（不属于游戏界面）">
  <strong id="toolbar-title">棋盘预览</strong>
  <label>场景
    <select id="scenario">
      <option value="default">正常</option>
      <option value="timeout">短等待（15 秒）</option>
      <option value="defeat">失败</option>
      <option value="load-error">首次载入失败</option>
      <option value="conflict">首个指令冲突</option>
      <option value="version">版本不一致</option>
      <option value="empty">没有遭遇</option>
      <option value="intents">意图展示（七种）</option>
    </select>
  </label>
  <button id="btn-offline" type="button" aria-pressed="false">断开连接</button>
  <button id="btn-drop" type="button">丢失下一条回执</button>
  <button id="btn-conflict" type="button">下一次指令冲突</button>
  <button id="btn-refresh" type="button">模拟刷新页面</button>
  <button id="btn-motion" type="button" aria-pressed="false">减少动态</button>
  <span id="source-label"></span>
  <span id="diag" aria-live="off"></span>
</div>
<script type="module" src="/src/tactical/tactical-board.ts"></script>
</body>
</html>
