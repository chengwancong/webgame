name: Source mirror CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: open-world
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      AW_DATABASE_URL: postgresql://abyss@127.0.0.1:5432/abyss_ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: abyss
          POSTGRES_DB: abyss_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U abyss -d abyss_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook test dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Install pnpm and locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Validate content and artwork metadata
        run: pnpm exec tsx tools/validate-content.ts --metadata-only
      - name: Test against PostgreSQL 18
        run: node tools/ci-tests.mjs --shard=${{ matrix.shard }}/3
