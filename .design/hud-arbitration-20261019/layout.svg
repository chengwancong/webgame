<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, sans-serif">
 <rect width="1280" height="720" fill="#6f9a4e"/>
 <text x="640" y="40" text-anchor="middle" font-size="18" fill="#fff" opacity=".7">1280×720 舞台 · HUD 仲裁分区</text>
 <!-- 左上 -->
 <rect x="0" y="0" width="440" height="300" fill="#fdf8ec" opacity=".85" stroke="#d9a92e" stroke-width="3"/>
 <text x="16" y="30" font-size="18" font-weight="bold" fill="#412402">左上 · 角色 + 追踪（≤3 行）</text>
 <rect x="16" y="50" width="380" height="44" rx="8" fill="#fff" stroke="#c9b48a"/><text x="28" y="78" font-size="16" fill="#412402">击败 · 格铎</text>
 <rect x="16" y="102" width="380" height="44" rx="8" fill="#fff" stroke="#c9b48a"/><text x="28" y="130" font-size="16" fill="#412402">出航 · 前往赤炉　Lv.15 可去</text>
 <rect x="16" y="154" width="380" height="44" rx="8" fill="#fff" stroke="#c9b48a"/><text x="28" y="182" font-size="16" fill="#412402">采集 · 熔甲片 7/10</text>
 <text x="16" y="230" font-size="14" fill="#8a5a1c">距离数字只在这里；跨岛不在世界里画</text>
 <!-- 右上 -->
 <rect x="1060" y="0" width="220" height="250" fill="#fdf8ec" opacity=".85" stroke="#d9a92e" stroke-width="3"/>
 <text x="1170" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#412402">小地图</text>
 <!-- 右中 Toast -->
 <rect x="900" y="256" width="370" height="200" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 6"/>
 <text x="912" y="282" font-size="16" font-weight="bold" fill="#fff">右中 · Toast 栈（≤3 条，切场景清空）</text>
 <rect x="912" y="296" width="346" height="40" rx="8" fill="#2a1d0e" opacity=".85"/><text x="926" y="322" font-size="15" fill="#fff">获得 熔甲片 ×3</text>
 <rect x="912" y="344" width="346" height="40" rx="8" fill="#2a1d0e" opacity=".85"/><text x="926" y="370" font-size="15" fill="#fff">铜 ×2　×3</text>
 <rect x="912" y="392" width="346" height="40" rx="8" fill="#7a1f1f" opacity=".9"/><text x="926" y="418" font-size="15" fill="#fff">连接中断 · 正在重连（2/5）</text>
 <!-- 底部 -->
 <rect x="0" y="600" width="1280" height="120" fill="#fdf8ec" opacity=".85" stroke="#d9a92e" stroke-width="3"/>
 <text x="16" y="628" font-size="18" font-weight="bold" fill="#412402">底部 · 技能栏 + A1 菜单 + 一行不可用原因</text>
 <g fill="#fff" stroke="#c9b48a"><rect x="480" y="640" width="60" height="60" rx="8"/><rect x="550" y="640" width="60" height="60" rx="8"/><rect x="620" y="640" width="60" height="60" rx="8"/><rect x="690" y="640" width="60" height="60" rx="8"/></g>
 <text x="615" y="634" text-anchor="middle" font-size="14" fill="#7a1f1f">该栏位没有技能 · 去技能页装配</text>
 <!-- 中央世界 -->
 <circle cx="640" cy="430" r="18" fill="#3b5bdb"/><text x="640" y="470" text-anchor="middle" font-size="14" fill="#fff">角色（脚下不画距离）</text>
 <rect x="560" y="340" width="160" height="38" rx="10" fill="#fdf8ec" stroke="#d9a92e" stroke-width="2"/><rect x="568" y="345" width="28" height="28" rx="6" fill="#f2c94c"/><text x="582" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#412402">E</text><text x="606" y="365" font-size="16" font-weight="bold" fill="#412402">采集 铜矿</text>
 <text x="640" y="330" text-anchor="middle" font-size="13" fill="#fff">交互气泡：全场只 1 个，耗尽/超距不显示</text>
 <polygon points="820,360 840,360 830,378" fill="#ffd23f" stroke="#2a1d0e" stroke-width="2"/><text x="830" y="350" text-anchor="middle" font-size="13" fill="#fff">同岛目标：只箭头</text>
 <g font-size="13" fill="#fff"><text x="200" y="420">熔岩蜥（精英）</text><text x="200" y="440" opacity=".5">采集点名 → 冲突则上移，仍冲突则隐藏</text></g>
 <!-- 弹窗栈 -->
 <g transform="translate(470,80)">
  <text x="0" y="0" font-size="16" font-weight="bold" fill="#fff">弹窗栈（高→低，只栈顶收输入）</text>
  <g font-size="14" fill="#412402">
   <rect x="0" y="12" width="340" height="30" rx="6" fill="#ffd6d6"/><text x="10" y="32">connection 恢复连接 · 操作永远可用</text>
   <rect x="0" y="46" width="340" height="30" rx="6" fill="#fdf8ec"/><text x="10" y="66">result 结算</text>
   <rect x="0" y="80" width="340" height="30" rx="6" fill="#fdf8ec"/><text x="10" y="100">confirm 确认框</text>
   <rect x="0" y="114" width="340" height="30" rx="6" fill="#fdf8ec"/><text x="10" y="134">panel 面板</text>
   <rect x="0" y="148" width="340" height="30" rx="6" fill="#e8f0ff"/><text x="10" y="168">card 信息卡 · 战斗中排队、不暂停</text>
  </g>
 </g>
</svg>
